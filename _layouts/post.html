---
layout: default
---

<article class="article">

  <a class="back" href="{{ '/' | relative_url }}">← Essays</a>

  <header class="article-header">
    <h1>{{ page.title }}</h1>

    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </header>

  <div class="article-content">
    {{ content }}
  </div>

</article>
