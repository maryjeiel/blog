---
layout: default
---

<div class="home-grid">

  <aside class="profile">
    <img
      class="avatar"
      src="{{ site.author.avatar | relative_url }}"
      alt="{{ site.author.name }}"
    >

    <h1>{{ site.author.name }}</h1>

    <div class="profile-links">
      <a href="https://x.com/{{ site.author.x }}" target="_blank" rel="noreferrer">X</a>
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </aside>

  <section class="posts">
    <h1 class="section-title">Essays</h1>

    {% for post in site.posts %}
      <article class="post-row">
        <h2>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h2>

        <time datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%B %-d, %Y" }}
        </time>

        {% if post.excerpt %}
          <p>{{ post.excerpt | strip_html | strip_newlines | truncatewords: 30 }}</p>
        {% endif %}
      </article>
    {% endfor %}
  </section>

</div>
